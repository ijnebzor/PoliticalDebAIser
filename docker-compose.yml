# PoliticalDebAIser — Docker Compose
# Runs the web app alongside a local Ollama instance for LLM inference.
#
# Usage:
#   Development:  docker compose up
#   Production:   docker compose --profile production up -d
#
# Environment variables (set in .env or export):
#   OLLAMA_MODEL   — Ollama model name (default: llama3.2)
#   RUST_LOG       — Log level: trace|debug|info|warn|error (default: info)
#   LOG_FORMAT     — Log output format: text|json (default: text)
#   CORS_ORIGIN    — Allowed CORS origin (default: http://localhost:3000)
#   LLM_PROVIDERS  — Comma-separated provider list, e.g. "groq,gemini,ollama"
#   GROQ_API_KEY   — API key for Groq provider (if using groq in LLM_PROVIDERS)
#   GEMINI_API_KEY — API key for Gemini provider (if using gemini in LLM_PROVIDERS)
#   HF_API_KEY     — API key for HuggingFace provider (if using hf in LLM_PROVIDERS)
#   CONFIG_AUTH_TOKEN — Bearer token for /config and /history DELETE endpoints

services:
  # --------------------------------------------------------------------------
  # app: the PoliticalDebAIser Axum server
  # --------------------------------------------------------------------------
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Point at the compose ollama service (not host.docker.internal)
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"

  # --------------------------------------------------------------------------
  # app-production: production-tuned app with stricter settings
  # --------------------------------------------------------------------------
  app-production:
    build: .
    profiles:
      - production
    ports:
      - "3000:3000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      RUST_LOG: ${RUST_LOG:-warn}
      LOG_FORMAT: json
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      LLM_PROVIDERS: ${LLM_PROVIDERS:-ollama}
      CONFIG_AUTH_TOKEN: ${CONFIG_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 256M
          cpus: "0.5"

  # --------------------------------------------------------------------------
  # ollama: local LLM inference server
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      # Persist downloaded models across container restarts
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
        reservations:
          memory: 1G
          cpus: "1.0"

volumes:
  ollama_models:
